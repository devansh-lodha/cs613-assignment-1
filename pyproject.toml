[project]
name = "cs613-assignment-1"
version = "0.1.0"
description = "Modular framework for EmbeddingGemma inference and geometric representation analysis"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.4.0",
    "bitsandbytes>=0.43.0",
    "datasets>=3.0.0",
    "huggingface-hub>=0.25.0",
    "matplotlib>=3.10.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.15.0",
    "tabulate>=0.9.0",
    "torch>=2.6.0",
    "transformers>=4.49.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "ty>=0.0.70",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embedding_gemma"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # Trailing comma missing (formatter conflict)
    "CPY",     # Missing copyright notice
    "D203",    # One blank line before class docstring (conflicts with D211)
    "D213",    # Multi-line docstring summary second line (conflicts with D212)
    "ISC001",  # Implicitly concatenated string literals (formatter conflict)
    "N812",    # Lowercase imported as non-lowercase (torch.nn.functional as F)
    "NPY002",  # Legacy np.random.seed (required for deterministic seeding)
    "TC001",   # Move application import into type-checking block
    "TC002",   # Move third-party import into type-checking block
    "TC003",   # Move standard library import into type-checking block
]

[tool.ruff.lint.isort]
known-first-party = ["embedding_gemma"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["INP001", "PLR0915", "PLR2004", "S101", "T201"]
"tests/*" = ["PLR2004", "S101"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.terminal]
output-format = "full"
error-on-warning = true

[tool.ty.src]
include = ["src/**/*.py", "scripts/**/*.py"]
